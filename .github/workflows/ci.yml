name: FleetControl CI

on:
  pull_request:
    branches:
      - develop
      - maintenance
      - main

  push:
    branches:
      - develop
      - maintenance
      - main

jobs:
  tests:
    name: Automated tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm run test:ci
